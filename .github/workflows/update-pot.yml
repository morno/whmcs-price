name: Update POT file

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.php"

permissions:
  contents: write

concurrency:
  group: update-pot-main
  cancel-in-progress: true

jobs:
  make-pot:
    # Prevents bot pushes from creating loops if you expand triggers later
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP + WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          # WP-CLI as a global tool (the phar bundles i18n-command), so the
          # repo's own composer.json is never touched by this workflow.
          tools: wp-cli

      - name: Generate .pot file
        run: |
          wp i18n make-pot . languages/whmcs-price.pot \
            --domain=whmcs-price \
            --exclude=build_temp,node_modules,languages,tests,vendor \
            --allow-root

      - name: Commit updated .pot file (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add languages/whmcs-price.pot

          # Visibility in the log (control + traceability)
          git diff --staged --stat || true
          
          if git diff --staged --quiet; then
            echo "No changes in POT file. Skipping commit."
            exit 0
            
          fi
          git commit -m "chore: update whmcs-price.pot [skip ci]"
          git pull --rebase --autostash origin main
          git push

